name: Launch readiness
on:
  pull_request:
  push:
    branches: [main, "readiness/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oj_test
          POSTGRES_PASSWORD: oj_test_local_only
          POSTGRES_DB: oj_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U oj_test -d oj_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oj_test:oj_test_local_only@127.0.0.1:55432/oj_test
      REDIS_URL: redis://127.0.0.1:56379
      RUN_DB_TESTS: "1"
      ECPAY_ENV: sandbox
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://127.0.0.1:55440
      NEXT_PUBLIC_API_URL: http://127.0.0.1:55440
      PLAYWRIGHT_PRODUCTION: "1"
      RUN_FULL_SITE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @oj/db exec prisma migrate deploy
      - run: python3 scripts/generate-school-catalog.py --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: docker build -f docker/Dockerfile.backup -t oj-readiness-backup .
      - run: python3 tests/backup-drill.py
        env:
          RUN_BACKUP_TESTS: "1"
          BACKUP_TEST_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm --filter @oj/api build
      - run: pnpm --filter @oj/judge build
      - run: docker build -f docker/Dockerfile.api -t oj-readiness-api .
      - run: docker build -f docker/Dockerfile.judge -t oj-readiness-judge .
      - run: pnpm test:runtime
      - run: docker build --tag oj-readiness-sandbox-fixture tests/sandbox
      - run: RUN_SANDBOX_TESTS=1 pnpm exec vitest run tests/sandbox-isolation.test.ts
      - run: pnpm --filter @oj/web build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          CROSS_BROWSER_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: test-results/
          retention-days: 14
