name: Setup workspace
description: pnpm, Node 22 with the pnpm store cache, dependencies and the Prisma client. Optionally applies migrations to the job's disposable database.
inputs:
  migrate:
    description: Apply Prisma migrations to the job's disposable database
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm db:generate
      shell: bash
    - if: inputs.migrate == 'true'
      run: pnpm --filter @oj/db exec prisma migrate deploy
      shell: bash
